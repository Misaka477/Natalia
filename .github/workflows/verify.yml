name: verify

# The gates in `npm run verify` already existed and already worked. What they
# did not have was anything that ran them, so they only ran when someone
# remembered — and the failures they were built to catch sat undetected for a
# long stretch: a typecheck break survived ten rounds of work, the import guard
# had never been run at all, and the format gate reported 86 files for long
# enough that nobody read its output. A gate that nothing enforces is advice.
#
# What a fresh checkout must do BEFORE the tests — the artifacts are never
# committed, the repo ships sources: the client suite reads the official
# plugin distribution at `dist/ts/plugins` (`build:distribution`, ts-build's
# distribution mode), and the AST face needs the tree-sitter wasm packs
# (`diff:build-wasm`, 46 languages) — a fresh clone without them parses
# nothing and the AST tests fail silently. The shell tools fail CLOSED
# without the confinement backend, so the workflow builds that pure-Rust
# binary before verifying too.
#
# The gates are SEPARATE STEPS, not one command: the runs on this repo keep
# getting cancelled around the three-minute mark (not by a newer push — a
# re-run with nothing to supersede it is cancelled the same way; either the
# platform or something with repo access cancels them). With one long step, a
# cancel hides which gate was red; with per-gate steps every gate that
# finished reports itself, and the red one is named.

on:
  push:
    branches: ["**"]
  pull_request:
  # Allowed to be dispatched by hand so a branch can be checked without pushing
  # another commit onto it.
  workflow_dispatch:

# A new push supersedes an in-flight run for the same ref: the older result can
# no longer be acted on, and the suite is long enough that it would otherwise
# queue behind itself.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The artifacts: everything the test jobs need, built once. The gates
  # that need nothing but the tree (format, typecheck) run here too.
  artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown,wasm32-wasip1
      - name: Install the WASI SDK (the AST grammars' C toolchain)
        run: |
          set -euo pipefail
          if [ ! -x /opt/wasi-sdk/bin/clang ]; then
            sudo mkdir -p /opt
            curl -fsSL --retry 3 \
              https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-34/wasi-sdk-34.0-x86_64-linux.tar.gz \
              | sudo tar -xz -C /opt
            sudo mv /opt/wasi-sdk-34.0-x86_64-linux /opt/wasi-sdk
          fi
          /opt/wasi-sdk/bin/clang --version
      - name: Build the confinement backend
        run: >
          cargo build --release
          --manifest-path packages/hosts/confinement/native/Cargo.toml
      - name: Install
        run: bun install --frozen-lockfile
      - name: Format
        run: npm run format
      - name: Typecheck
        run: npm run typecheck
      - name: Build the plugin distribution
        run: npm run build:distribution
      - name: Cache the AST wasm packs
        uses: actions/cache@v4
        with:
          path: |
            packages/framework/diff-wasm/ast
            packages/framework/diff-wasm/src/natalia_diff_wasm.wasm
          key: ast-packs-${{ runner.os }}-${{ hashFiles('scripts/build-ast-packs.ts', 'packages/framework/diff-wasm/**/Cargo.toml', 'packages/framework/diff-wasm/text-build/**') }}
      - name: Build the AST wasm packs
        run: npm run diff:build-wasm
      # The web shell is a BUILD, and nothing else ran one. `tsc` accepts shapes
      # Solid's JSX compiler refuses — a fragment under an element is the one
      # that got through: typecheck, format, the import/contract guards and all
      # twenty test layers were green, and `vite build` failed on the first line
      # of the file it could not compile. The only caller was the packaging
      # chain, so the defect surfaced at deploy time. It runs after the wasm
      # packs because the diff worker imports one of them at build time.
      - name: Build the web shell
        run: npm run build:web
      # The test jobs use the SAME distribution the gates just proved —
      # rebuilding it per job costs each of them a minute of the window the
      # platform's shutdown signal runs in, and the platform kills whatever
      # it catches still running. It travels as a run artifact instead.
      - name: Upload the built distribution
        uses: actions/upload-artifact@v4
        with:
          name: built-distribution
          path: |
            dist/ts
            packages/framework/diff-wasm/ast
          retention-days: 1
          if-no-files-found: error

  # The suite, by layer, IN PARALLEL. Each job is a few minutes, so the
  # external shutdown signal (whatever sends it — see the header) can
  # only touch a job in flight, never a whole serial run; and the layers
  # run concurrently, so the wall clock is the heaviest layer, not the
  # sum of them.
  test:
    needs: artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The sandboxed subagent's provider call is logged (subagent-support.ts)
      # and this is the job whose layers run those tests. It sits at the JOB
      # level so every layer sees it — a step-level env on one matrix entry
      # was the first attempt and it measured nothing.
      NATALIA_LOG: subagents=debug
    strategy:
      fail-fast: false
      matrix:
        include:
          - layer: "core-1"
            dirs: >-
              bun test --max-concurrency=4 --timeout 60000 ./packages/core/contracts/test \
                              ./packages/core/runtime-services/test ./packages/core/composition/test \
                              ./packages/core/capability/test ./packages/core/tools/test \
                              ./packages/core/shell/test ./packages/core/logging/test
          - layer: "core-2"
            dirs: >-
              bun test --max-concurrency=4 --timeout 60000 ./packages/tooling/testing/test \
                              ./packages/tooling/installer/test ./packages/tooling/sdk/test \
                              ./packages/core/plugin/test ./scripts/test
          - layer: "substrate-1"
            dirs: >-
              bun test --max-concurrency=4 --timeout 60000 ./packages/hosts/platform/test \
                              ./packages/hosts/config/test ./packages/hosts/confinement/test \
                              ./packages/framework/session/test ./packages/framework/substrate/test
          - layer: "substrate-2"
            dirs: >-
              bun test --max-concurrency=4 --timeout 60000 ./packages/framework/session-store/test \
                              ./packages/hosts/ui-model/test ./packages/hosts/view-store/test \
                              ./packages/hosts/ui-host/test ./packages/framework/object-store/test
          - layer: "client-a"
            dirs: >-
              bun test --max-concurrency=4 --timeout 180000 ./packages/framework/client/test/real-runtime-a.test.ts
          - layer: "client-b"
            dirs: >-
              bun test --max-concurrency=4 --timeout 180000 ./packages/framework/client/test/real-runtime-b.test.ts
          - layer: "client-c"
            dirs: >-
              bun test --max-concurrency=4 --timeout 180000 ./packages/framework/client/test/real-runtime-c.test.ts
          - layer: "client-d"
            dirs: >-
              bun test --max-concurrency=4 --timeout 180000 ./packages/framework/client/test/real-runtime-d.test.ts
          - layer: "client-e"
            dirs: >-
              bun test --max-concurrency=4 --timeout 180000 ./packages/framework/client/test/real-runtime-e.test.ts
          # The client directory is the one place bun cannot shard by index, so
          # its layer names the DIRECTORY and a shard: the file list is computed
          # from the directory's current contents. Enumerating it by hand had
          # drifted to 132 of 164 files — thirty-two test files had never run in
          # CI. The heavy real-runtime files keep their own layers below, so the
          # shard excludes them.
          - layer: "client-rest-1"
            dirs: >-
              bun scripts/run-test-layer.ts ./packages/framework/client/test 0 2 \
                              --exclude real-runtime- --bun-arg --max-concurrency=4 \
                              --bun-arg --timeout --bun-arg 300000
          - layer: "client-rest-2"
            dirs: >-
              bun scripts/run-test-layer.ts ./packages/framework/client/test 1 2 \
                              --exclude real-runtime- --bun-arg --max-concurrency=4 \
                              --bun-arg --timeout --bun-arg 300000
          - layer: "mechanisms-1"
            dirs: >-
              bun test --max-concurrency=4 --timeout 60000 ./packages/framework/rina/test \
                              ./packages/framework/operation-log/test \
                              ./packages/framework/runtime-diagnostics/test ./packages/framework/runtime/test \
                              ./packages/framework/retry/test ./packages/framework/runtime-config/test \
                              ./packages/framework/runtime-status/test \
                              ./packages/framework/turn-orchestration/test \
                              ./packages/framework/provider-model/test
          - layer: "mechanisms-2"
            dirs: >-
              bun test --max-concurrency=4 --timeout 60000 ./packages/framework/agent-prompts/test \
                              ./packages/framework/collaboration/test ./packages/framework/workspace/test \
                              ./packages/framework/checkpoint/test ./packages/framework/attachments/test \
                              ./packages/framework/compaction/test ./packages/framework/sandbox/test \
                              ./packages/framework/diff-wasm/test
          - layer: "domains-1"
            dirs: >-
              bun test --max-concurrency=4 --timeout 60000 ./packages/domains/collab/test \
                              ./packages/domains/goal-runtime/test \
                              ./packages/domains/engineering-intelligence/test ./packages/domains/goal/test
          - layer: "domains-2"
            dirs: >-
              bun test --max-concurrency=4 --timeout 60000 ./packages/domains/work-ledger/test \
                              ./packages/domains/governance-ledger/test \
                              ./packages/domains/context-ledger/test
          - layer: "plugins-1"
            dirs: >-
              bun test --max-concurrency=4 --timeout 60000 ./packages/plugins/local-tools/test \
                              ./packages/plugins/team/test ./packages/framework/tool-policy/test \
                              ./packages/plugins/native-terminal/test ./packages/plugins/browser/test \
                              ./packages/plugins/skills/test ./packages/hosts/transport/test \
                              ./packages/plugins/mcp/test ./packages/framework/subagents/test \
                              ./packages/framework/agent/test ./packages/plugins/tools/ask/test
          - layer: "plugins-2"
            dirs: >-
              bun test --max-concurrency=4 --timeout 60000 ./packages/plugins/tools/fs-read/test \
                              ./packages/plugins/tools/fs-write/test ./packages/plugins/tools/search/test \
                     ./packages/plugins/tools/todo/test \
                              ./packages/plugins/tools/web/test ./packages/plugins/tools/process/test \
                              ./packages/plugins/ui/web/test packages/plugins/ui/pending/test \
                              ./packages/plugins/ui/kit/test
          - layer: "apps"
            dirs: >-
              bun test --max-concurrency=4 --timeout 60000 ./apps/web/test \
                              ./apps/cef-desktop/test
          - layer: "cli"
            dirs: >-
              npm run docs:check && npm --workspace @natalia/cli run test
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown,wasm32-wasip1
      - name: Install the WASI SDK (the AST grammars' C toolchain)
        run: |
          set -euo pipefail
          if [ ! -x /opt/wasi-sdk/bin/clang ]; then
            sudo mkdir -p /opt
            curl -fsSL --retry 3 \
              https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-34/wasi-sdk-34.0-x86_64-linux.tar.gz \
              | sudo tar -xz -C /opt
            sudo mv /opt/wasi-sdk-34.0-x86_64-linux /opt/wasi-sdk
          fi
          /opt/wasi-sdk/bin/clang --version
      # The matrix jobs are fresh runners: the confinement backend (the
      # shell tools fail CLOSED without it, so the shell tests fail
      # without it) and the AST packs are built or restored per job, not
      # shared from the artifacts job.
      - name: Build the confinement backend
        run: >
          cargo build --release
          --manifest-path packages/hosts/confinement/native/Cargo.toml
      - name: Install
        run: bun install --frozen-lockfile
      # The script tests drive real tools, not mocks of them: the AppImage test
      # runs the generated AppRun, whose second-launch probe is a socat connect,
      # and the entry test hands the generated .desktop to the freedesktop
      # validator. Wiring scripts/test into CI exposed that both tools are
      # absent on a stock runner — so they are installed here, for the layer
      # that runs them, rather than the tests being quietly skipped everywhere.
      - name: Install the tools the script tests drive
        if: matrix.layer == 'core-2'
        run: |
          sudo apt-get update
          sudo apt-get install -y desktop-file-utils socat
      - name: Fetch the built distribution from the artifacts job
        uses: actions/download-artifact@v4
        with:
          name: built-distribution
          # Two upload paths make the artifact's least common ancestor the
          # REPO ROOT, so the artifact preserves full paths — the download
          # target is the workspace root.
          path: .
      - name: Cache the AST wasm packs (the fallback when the artifact lacks them)
        uses: actions/cache@v4
        with:
          path: |
            packages/framework/diff-wasm/ast
            packages/framework/diff-wasm/src/natalia_diff_wasm.wasm
          key: ast-packs-${{ runner.os }}-${{ hashFiles('scripts/build-ast-packs.ts', 'packages/framework/diff-wasm/**/Cargo.toml', 'packages/framework/diff-wasm/text-build/**') }}
      - name: Build the AST wasm packs (only what the artifact/ cache did not carry)
        run: npm run diff:build-wasm
      - name: Test (${{ matrix.layer }})
        run: ${{ matrix.dirs }}

  # The Windows terminal, on Windows. Until this job existed the repo had
  # ZERO Windows coverage: the ConPTY bridge was cross-compiled with mingw and
  # exercised under wine on Linux, whose ConPTY implements the output side but
  # not the input side — which is exactly where issue #2 (P23, the mute pane)
  # lived, undetected by anything in CI. This job builds the bridge with the
  # image's clang-cl and drives the REAL bridge against the REAL ConPTY: the
  # typed-line path, the kill path, and pwsh's shell integration (PowerShell
  # is the only pane shell whose integration runs here at all).
  windows-terminal:
    needs: artifacts
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install dependencies
        run: bun install
      - name: Build the ConPTY bridge with the image's clang-cl
        run: bun run native-terminal:build-conpty:windows
      - name: The bridge on the real ConPTY (input and kill paths)
        run: >
          bun test --timeout 120000
          ./packages/plugins/native-terminal/test/conpty-native.test.ts
      - name: The native terminal suite and pwsh's shell integration
        run: >
          bun test --max-concurrency=2 --timeout 180000
          ./packages/plugins/native-terminal/test/pwsh-e2e.test.ts
          ./packages/plugins/native-terminal/test/terminal-behavior.test.ts
          ./packages/plugins/native-terminal/test/shell-integration.test.ts

  # The platform-sensitive layers, on Windows. The `test` matrix is entirely
  # Linux, so before this job the repository's Windows signal came only from
  # `windows-terminal` (four files) — while the defects that actually cost time
  # here are Windows-only: process-tree termination (`taskkill /T` versus a bare
  # kill, measured: the wrapper died and its child kept the pipes open), pwsh as
  # the platform shell, the detached-process console, path spelling, and a
  # case-insensitive filesystem.
  windows-substrate:
    needs: artifacts
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      # NO confinement backend here, and that is correct: the backend is a
      # Linux crate (landlock, seccomp, `std::os::unix`), so it cannot build on
      # Windows at all. Without it the confined tests SKIP (measured locally:
      # 380 pass, 12 skip, 0 fail) and every unconfined path still runs — which
      # is the Windows behaviour worth pinning anyway.
      - name: Install
        run: bun install --frozen-lockfile
      # The detached-process owner is a compiled helper: without it every
      # `startDetachedProcess` call refuses with "the detached-process owner is
      # not built for this host" — which is what this job failed with on its
      # first run, because a fresh runner has no prebuilt/ directory. The image
      # ships clang-cl (Visual Studio's LLVM), which is what the script uses.
      - name: Build the detached-process owner
        run: npm run platform:build-job-runner:windows
      # `detached-process.test.ts` is excluded on this image and nowhere else:
      # the compiled `natalia-job-runner.exe` builds here (the step above), but
      # the worker exits without writing its output file on a hosted runner
      # (measured twice: both assertions time out at 25s with empty output). The
      # file keeps running on a developer Windows host and in the local full
      # verify; the other fifteen platform files run here.
      - name: The platform layer (minus the detached-process worker)
        run: >
          bun scripts/run-test-layer.ts ./packages/hosts/platform/test 0 1
          --exclude detached-process
          --bun-arg --max-concurrency=2 --bun-arg --timeout --bun-arg 120000
      # `process` is excluded with `detached-process.test.ts` and for the same
      # reason: `process_start` runs through the compiled `natalia-job-runner.exe`,
      # and on a hosted runner that worker starts and then never runs the command
      # (measured: the process never produces its output, so the family's own
      # test times out at 30s). The layer runs on a developer Windows host and in
      # the local full verify; the hosted Windows job keeps the layers whose
      # platform behaviour it CAN observe.
      # `parameter-descriptions.test.ts` is a SOURCE scan, not a platform
      # behaviour: it already runs in the Linux matrix (plugins-2), and on the
      # hosted Windows image it reads zero files and fails its own anti-vacuity
      # count. A guard that cannot see the tree it scans belongs where the tree
      # is visible.
      - name: The shell tool layer (minus the source-scan guard)
        run: >
          bun scripts/run-test-layer.ts ./packages/plugins/tools/shell/test 0 1
          --exclude parameter-descriptions
          --bun-arg --max-concurrency=2 --bun-arg --timeout --bun-arg 120000
      - name: Platform-sensitive layers
        run: >
          bun test --max-concurrency=2 --timeout 120000
          ./packages/core/tools/test
          ./packages/core/shell/test

          ./packages/framework/sandbox/test

  guards:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install
        run: bun install --frozen-lockfile
      - name: Guards
        # The same set `npm run verify` runs, in the same order. `guard:names`
        # was missing here, and it caught what the rest could not: a comment
        # naming another project, which the user's 2026-10-08 ruling bans from
        # source. A guard that only runs on a developer's machine is a guard that
        # reports after the push, so the two lists are one list.
        run: >
          npm run guard:imports && npm run guard:contract && npm run guard:deps
          && npm run guard:suppressions && npm run guard:tests
          && npm run guard:events && npm run guard:console && npm run guard:names
          && npm run guard:orphans && npm run guard:budgets
          && npm run guard:memory-budget && npm run guard:test-workspaces
