[package]
name = "natalia-object-store"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

# Zero dependencies by design (the object-store-rust plan's Phase A +
# this sandbox's rule): a std-only crate builds offline from a fresh
# CARGO_HOME, so no registry fetch can poison or slow the chain. The
# SHA-256 in lib.rs is FIPS 180-4, pinned by NIST vectors in the TS
# tests and live-diffed against node:crypto.

[lib]
crate-type = ["cdylib"]

# Phase B: the resident daemon is a BINARY target in this crate (the same
# sources the cdylib exposes, one process that lives). A path dependency
# on the index crate keeps the offline build: nothing is fetched.
[dependencies]
natalia-index-native = { path = "../native-index" }

[[bin]]
name = "natalia-object-store-daemon"
path = "src/server.rs"
