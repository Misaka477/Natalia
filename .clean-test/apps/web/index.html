<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Natalia</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
      }
      #root {
        width: 100vw;
        height: 100vh;
      }
      #natalia-startup-mask {
        position: fixed;
        inset: 0;
        z-index: 999999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #101014;
        color: #e5e5e5;
        font-family: ui-sans-serif, system-ui, sans-serif;
        transition: opacity 0.35s ease;
      }
      #natalia-startup-mask.natalia-startup-mask-hide {
        opacity: 0;
        pointer-events: none;
      }
      .natalia-startup-mask-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
      }
      .natalia-startup-title {
        font-size: 28px;
        font-weight: 600;
        letter-spacing: 0.08em;
      }
      .natalia-startup-dots {
        display: flex;
        gap: 7px;
      }
      .natalia-startup-dots span {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #7aa2f7;
        animation: natalia-pulse 1s infinite ease-in-out;
      }
      .natalia-startup-dots span:nth-child(2) {
        animation-delay: 0.15s;
      }
      .natalia-startup-dots span:nth-child(3) {
        animation-delay: 0.3s;
      }
      .natalia-startup-vivy {
        font-size: 12px;
        color: rgba(229, 229, 229, 0.55);
        letter-spacing: 0.04em;
      }
      @keyframes natalia-pulse {
        0%, 80%, 100% {
          opacity: 0.25;
          transform: scale(0.8);
        }
        40% {
          opacity: 1;
          transform: scale(1.1);
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="natalia-startup-mask">
      <div class="natalia-startup-mask-content">
        <div class="natalia-startup-title">Natalia</div>
        <div class="natalia-startup-dots"><span></span><span></span><span></span></div>
        <div class="natalia-startup-vivy">「あなたの笑顔も守りたい。」</div>
      </div>
    </div>
    <script type="module" src="/src/main-neu-light.ts"></script>
  </body>
</html>
