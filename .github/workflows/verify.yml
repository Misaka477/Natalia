name: verify

# The gates in `npm run verify` already existed and already worked. What they
# did not have was anything that ran them, so they only ran when someone
# remembered — and the failures they were built to catch sat undetected for a
# long stretch: a typecheck break survived ten rounds of work, the import guard
# had never been run at all, and the format gate reported 86 files for long
# enough that nobody read its output. A gate that nothing enforces is advice.
#
# What a fresh checkout must do BEFORE the tests — the artifacts are never
# committed, the repo ships sources: the client suite reads the official
# plugin distribution at `dist/ts/plugins` (`build:distribution`, ts-build's
# distribution mode), and the AST face needs the tree-sitter wasm packs
# (`diff:build-wasm`, 46 languages) — a fresh clone without them parses
# nothing and the AST tests fail silently. The shell tools fail CLOSED
# without the confinement backend, so the workflow builds that pure-Rust
# binary before verifying too.
#
# The gates are SEPARATE STEPS, not one command: the runs on this repo keep
# getting cancelled around the three-minute mark (not by a newer push — a
# re-run with nothing to supersede it is cancelled the same way; either the
# platform or something with repo access cancels them). With one long step, a
# cancel hides which gate was red; with per-gate steps every gate that
# finished reports itself, and the red one is named.

on:
  push:
    branches: ["**"]
  pull_request:
  # Allowed to be dispatched by hand so a branch can be checked without pushing
  # another commit onto it.
  workflow_dispatch:

# A new push supersedes an in-flight run for the same ref: the older result can
# no longer be acted on, and the suite is long enough that it would otherwise
# queue behind itself.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    # The suite runs ~2900 tests and the artifact builds precede it. The cap
    # is here so a hang fails the job rather than occupying a runner until
    # the platform's own limit.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # Both runtimes, because the scripts use each: the workspace installs
      # with bun (the only lockfile is `bun.lock`), and the `verify` script
      # and the scripts it chains invoke `npm run …` and `npx …`.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      # Rust for both native artifacts: the confinement backend (the shell
      # tools fail CLOSED without it — never run unconstrained) and the AST
      # tree-sitter wasm packs. The packs build with TWO targets — the core
      # with wasm32-unknown-unknown, the 46 per-language packs with
      # wasm32-wasip1 — and they need the WASI SDK's clang (the grammars'
      # C compiles to wasm): without either, every pack build fails and the
      # AST face silently parses nothing (the CI red this closes).
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown,wasm32-wasip1
      - name: Install the WASI SDK (the AST grammars' C toolchain)
        run: |
          set -euo pipefail
          if [ ! -x /opt/wasi-sdk/bin/clang ]; then
            sudo mkdir -p /opt
            curl -fsSL --retry 3 \
              https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-34/wasi-sdk-34.0-x86_64-linux.tar.gz \
              | sudo tar -xz -C /opt
            sudo mv /opt/wasi-sdk-34.0-x86_64-linux /opt/wasi-sdk
          fi
          /opt/wasi-sdk/bin/clang --version
      - name: Build the confinement backend
        run: >
          cargo build --release
          --manifest-path packages/hosts/confinement/native/Cargo.toml

      # `--frozen-lockfile` so a dependency that would drift from the
      # committed lockfile fails here instead of silently changing what is
      # being verified.
      - name: Install
        run: bun install --frozen-lockfile

      # The gates, one step each (see the header). The artifacts the tests
      # read are built before the tests, never after.
      - name: Format
        run: npm run format
      - name: Typecheck
        run: npm run typecheck
      - name: Build the plugin distribution
        run: npm run build:distribution
      - name: Build the AST wasm packs
        run: npm run diff:build-wasm
      # The suite, chunked by layer. One long step meant the external
      # shutdown signal (whatever sends it) erased the evidence of
      # everything before the cancel; each chunk reports for itself, so a
      # cancel costs at most the chunk in flight.
      - name: Test (contracts, core, and tooling)
        run: |
          bun test --max-concurrency=4 --timeout 60000 ./packages/core/contracts/test \
                    ./packages/core/runtime-services/test ./packages/core/composition/test \
                    ./packages/core/capability/test ./packages/core/tools/test ./packages/tooling/testing/test \
                    ./packages/tooling/installer/test ./packages/tooling/sdk/test ./packages/core/plugin/test
      - name: Test (session and store substrate)
        run: |
          bun test --max-concurrency=4 --timeout 60000 ./packages/hosts/platform/test \
                    ./packages/hosts/config/test ./packages/hosts/confinement/test \
                    ./packages/framework/session/test ./packages/framework/substrate/test \
                    ./packages/framework/session-store/test ./packages/hosts/ui-model/test \
                    ./packages/hosts/view-store/test ./packages/hosts/ui-host/test \
                    ./packages/hosts/object-store/test
      - name: Test (the client runtime — the heaviest file)
        run: |
          bun test --max-concurrency=4 --timeout 60000 ./packages/framework/client/test
      - name: Test (framework mechanisms)
        run: |
          bun test --max-concurrency=4 --timeout 60000 ./packages/framework/rina/test \
                    ./packages/framework/operation-log/test ./packages/framework/runtime-diagnostics/test \
                    ./packages/framework/runtime/test ./packages/framework/retry/test \
                    ./packages/framework/runtime-config/test ./packages/framework/runtime-status/test \
                    ./packages/framework/turn-orchestration/test ./packages/framework/provider-model/test \
                    ./packages/framework/agent-prompts/test ./packages/framework/collaboration/test \
                    ./packages/framework/workspace/test ./packages/framework/checkpoint/test \
                    ./packages/framework/attachments/test ./packages/framework/compaction/test \
                    ./packages/framework/sandbox/test ./packages/framework/diff-wasm/test
      - name: Test (domains and product policy)
        run: |
          bun test --max-concurrency=4 --timeout 60000 ./packages/domains/collab/test \
                    ./packages/domains/goal-runtime/test ./packages/domains/engineering-intelligence/test \
                    ./packages/domains/goal/test ./packages/domains/work-ledger/test \
                    ./packages/domains/governance-ledger/test ./packages/domains/context-ledger/test
      - name: Test (plugins, tools, and facets)
        run: |
          bun test --max-concurrency=4 --timeout 60000 ./packages/plugins/local-tools/test \
                    ./packages/plugins/team/test ./packages/framework/tool-policy/test \
                    ./packages/plugins/native-terminal/test ./packages/plugins/browser/test \
                    ./packages/plugins/skills/test ./packages/hosts/transport/test ./packages/plugins/mcp/test \
                    ./packages/framework/subagents/test ./packages/framework/agent/test \
                    ./packages/plugins/tools/ask/test ./packages/plugins/tools/fs-read/test \
                    ./packages/plugins/tools/fs-write/test ./packages/plugins/tools/search/test \
                    ./packages/plugins/tools/shell/test ./packages/plugins/tools/todo/test \
                    ./packages/plugins/tools/web/test ./packages/plugins/tools/process/test \
                    ./packages/plugins/ui/web/test packages/plugins/ui/pending/test \
                    ./packages/plugins/ui/kit/test
      - name: Test (the CLI suite and the docs gate)
        run: npm run docs:check && npm --workspace @natalia/cli run test
      - name: Guards
        run: >
          npm run guard:imports && npm run guard:contract && npm run guard:deps
          && npm run guard:suppressions && npm run guard:tests
          && npm run guard:events && npm run guard:console
          && npm run guard:test-workspaces
